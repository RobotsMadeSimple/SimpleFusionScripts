<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BuildBook annotations</title>
<link rel="stylesheet" href="annotate.css">
</head>
<body>
  <header class="bar toolbar">
    <div class="group" id="tools">
      <button class="tool on" data-tool="select" title="Select / move (V)"><svg viewBox="0 0 16 16"><path d="M3.5 2.5l9 4.6-4 1.3-1.4 4z"/></svg></button>
      <button class="tool" data-tool="arrow" title="Arrow: drag (A). Shift = 45 degree steps"><svg viewBox="0 0 16 16"><path d="M3 13L13 3 M7.5 3H13v5.5"/></svg></button>
      <button class="tool" data-tool="line" title="Line: drag (L). Shift = 45 degree steps"><svg viewBox="0 0 16 16"><path d="M3 13L13 3"/></svg></button>
      <button class="tool" data-tool="rect" title="Rectangle: drag (R). Shift = square"><svg viewBox="0 0 16 16"><rect x="2.5" y="3.5" width="11" height="9"/></svg></button>
      <button class="tool" data-tool="ellipse" title="Ellipse: drag (E). Shift = circle"><svg viewBox="0 0 16 16"><ellipse cx="8" cy="8" rx="6" ry="4.5"/></svg></button>
      <button class="tool" data-tool="text" title="Text: click (T)"><svg viewBox="0 0 16 16"><path d="M3.5 4.5v-1.5h9v1.5 M8 3v10 M6 13h4"/></svg></button>
      <button class="tool" data-tool="callout" title="Numbered callout: click, or drag from the target to the balloon (C)"><svg viewBox="0 0 16 16"><circle cx="6" cy="6" r="3.8"/><path d="M8.9 8.9L13.5 13.5"/><circle cx="13.5" cy="13.5" r=".6"/></svg></button>
    </div>
    <span class="sep"></span>
    <div class="group">
      <button class="icon-btn" id="btnUndo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16"><path d="M4.5 6.5h5a3 3 0 0 1 0 6H6 M6.5 3.8L3.8 6.5l2.7 2.7"/></svg></button>
      <button class="icon-btn" id="btnRedo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 16 16"><path d="M11.5 6.5h-5a3 3 0 0 0 0 6H10 M9.5 3.8l2.7 2.7-2.7 2.7"/></svg></button>
      <button class="icon-btn danger" id="btnDelete" title="Delete selected (Delete)"><svg viewBox="0 0 16 16"><path d="M3 4.5h10 M6 4.5V2.8h4v1.7 M4.5 4.5l.6 8.7h5.8l.6-8.7"/></svg></button>
      <button class="btn small" id="btnRenumber" title="Renumber callouts 1..N, top to bottom, left to right">Renumber</button>
    </div>
    <span class="spacer"></span>
    <div class="group">
      <button class="btn small" id="btnClear" title="Delete every annotation on this picture">Clear all</button>
      <button class="btn small" id="btnRefresh" title="Re-render the picture (after changing the camera or crop in Fusion)">Re-render picture</button>
      <button class="btn small primary" id="btnDone" title="Save and close">Done</button>
    </div>
  </header>

  <div class="bar stylebar" id="stylebar">
    <div class="group" id="swatches"></div>
    <input type="color" id="colorCustom" title="Custom colour" value="#d9463e">
    <span class="sep"></span>
    <label class="fld" title="Line weight (1/1000 of the picture width)">Weight
      <input type="range" id="weight" min="1" max="12" step="1" value="3">
      <input type="number" id="weightNum" class="num" min="0.5" max="100" step="0.5" value="3"
             title="Any weight: type it (0.5 to 100). Arrow heads grow with it."></label>
    <button class="tg" id="dashed" title="Dashed line"><svg viewBox="0 0 16 16"><path d="M1.5 8h3 M6.5 8h3 M11.5 8h3"/></svg></button>
    <label class="fld" id="fHeads" title="Arrow heads">Heads
      <select id="heads"><option value="none">None</option><option value="end">End</option><option value="both">Both</option></select></label>
    <button class="tg" id="fill" title="Light fill (rectangle / ellipse)"><svg viewBox="0 0 16 16"><rect x="3" y="3.5" width="10" height="9" fill="currentColor" fill-opacity=".3"/></svg><span>Fill</span></button>
    <label class="fld" id="fOpacity" title="Fill opacity (rectangle / ellipse)">Opacity
      <input type="number" id="fillOpacity" min="5" max="100" step="5" value="15">%</label>
    <span class="sep"></span>
    <label class="fld" id="fSize" title="Text size / balloon size (1/1000 of the picture width)">Size
      <input type="number" id="size" min="10" max="400" step="1" value="28"></label>
    <button class="tg" id="bold" title="Bold text"><b>B</b></button>
    <button class="tg" id="box" title="White box behind the text"><svg viewBox="0 0 16 16"><rect x="2.5" y="4" width="11" height="8"/><path d="M5.5 10V6.5h2.5"/></svg><span>Box</span></button>
    <button class="tg" id="leader" title="Leader arrow from the text to a target (drag its handle)"><svg viewBox="0 0 16 16"><path d="M2.5 4.5h6 M8 11.5L13.5 13.5 M13.5 13.5L11 9.5 M13.5 13.5L9.5 13"/></svg><span>Leader</span></button>
    <span class="spacer"></span>
    <span class="sub" id="styleTarget"></span>
  </div>

  <main id="stage" class="stage">
    <div id="wrap" class="wrap hidden">
      <img id="pic" alt="" draggable="false">
      <canvas id="cv"></canvas>
      <textarea id="txtEd" class="editor hidden" wrap="off" spellcheck="false"></textarea>
      <input id="numEd" class="editor-num hidden" type="text" inputmode="numeric" spellcheck="false">
    </div>
    <div id="msg" class="msg">Waiting for the picture...</div>
  </main>

  <footer class="status">
    <span id="title" class="title"></span>
    <span id="hint" class="hint"></span>
  </footer>

  <script src="annot_draw.js"></script>
  <script src="annotate.js"></script>
</body>
</html>
